# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "ada962613fe24090b2c6a9a36963e797"
name = "Popup Builder"
application_url = "https://pop-up-builder-five.vercel.app"
embedded = false

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_themes,write_themes,write_products,write_metaobjects,write_metaobject_definitions"

[app_proxy]
url = "https://pop-up-builder-five.vercel.app/api/storefront"
subpath = "popup-builder"
prefix = "apps"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ "https://pop-up-builder-five.vercel.app/auth/callback", "https://pop-up-builder-five.vercel.app/auth/shopify/callback", "https://pop-up-builder-five.vercel.app/api/auth/callback" ]

[build]
automatically_update_urls_on_dev = true

[webhooks.privacy_compliance]
customer_deletion_url = "https://pop-up-builder-five.vercel.app/webhooks/customers/redact"
customer_data_request_url = "https://pop-up-builder-five.vercel.app/webhooks/customers/data_request"
shop_deletion_url = "https://pop-up-builder-five.vercel.app/webhooks/shop/redact"
